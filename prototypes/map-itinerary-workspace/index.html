<body>
  <!-- Three variants of the map and itinerary workspace, switchable via ?variant=, on one throwaway route. -->
  <div id="app"></div>
  <script>
    const destinations = [
      {id:'barelang',name:'Barelang Bridge',cat:'Attractions & landmarks',area:'Barelang',cost:'Free',duration:'1 hr',x:67,y:72},
      {id:'nagoya',name:'Nagoya Hill',cat:'Shopping',area:'Nagoya',cost:'Free entry',duration:'2 hr',x:39,y:35},
      {id:'mubut',name:'Pantai Mubut',cat:'Nature & beaches',area:'Galang',cost:'IDR 10k–20k',duration:'2 hr',x:79,y:84},
      {id:'tua',name:'Tua Pek Kong Temple',cat:'Culture & worship',area:'Lubuk Baja',cost:'Free',duration:'45 min',x:45,y:42},
      {id:'mariott',name:'Batam Marriott Hotel Harbour Bay',cat:'Accommodation',area:'Batu Ampar',cost:'',duration:'',x:27,y:28}
    ];
    const names = {A:'Three-pane planner',B:'Map canvas + sheets',C:'Guided planning rail',D:'Persistent two-pane workspace'};
    const state = {variant:new URLSearchParams(location.search).get('variant')||'D',scenario:'planning',viewport:'responsive',mobileTab:'map',paneTab:'trip',discoverView:'list',desktopSplit:60,mobileSplit:45,focused:'barelang',selected:new Set(['barelang','nagoya','tua']),editing:true,accommodation:'mariott',transport:'Car / taxi',boundaries:true};
    if(!names[state.variant]) state.variant='A';
    const esc=s=>String(s).replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
    function scenarioState(){
      const s=state.scenario;
      return {ready:s==='ready',stale:s==='stale'||s==='infeasible',infeasible:s==='infeasible',noResults:s==='no-results',mapFailed:s==='map-failed',offline:s==='offline',missing:s==='missing'};
    }
    function header(){const s=scenarioState(), status=s.stale?'Needs rebuilding':s.ready?'Itinerary ready':'Draft';return `<header class="topbar"><div class="brand"><span class="brand-mark">B</span> Batam planner</div><button class="btn trip-name" data-action="trips">Long weekend in Batam ▾</button><span class="status ${s.stale?'stale':''}">${state.editing?'Editing Trip · ':''}${status}</span><div class="top-actions"><button class="btn" data-action="edit">${state.editing?'Done':'Edit trip'}</button></div></header>`}
    function tools(){return `<div class="prototype-tools"><strong>Throwaway prototype</strong><label>Scenario <select data-action="scenario">${[['planning','Planning'],['ready','Itinerary ready'],['stale','Needs rebuilding'],['infeasible','Infeasible rebuild'],['missing','Missing ferry details'],['no-results','No matching Destinations'],['map-failed','Map unavailable'],['offline','Connection lost']].map(([v,l])=>`<option value="${v}" ${state.scenario===v?'selected':''}>${l}</option>`).join('')}</select></label><label>Preview <select data-action="viewport"><option value="responsive">Responsive</option><option value="phone" ${state.viewport==='phone'?'selected':''}>Phone frame</option></select></label><span class="state-readout">State · ${state.editing?'editing':'viewing'} · ${state.selected.size} selected · focused: ${destinations.find(d=>d.id===state.focused)?.name||'none'}</span></div>`}
    function destinationCard(d,compact=false){const selected=state.selected.has(d.id), accommodation=state.accommodation===d.id;return `<article class="destination ${state.focused===d.id?'focused':''}" data-action="focus" data-id="${d.id}"><div class="thumb"></div><div><h3>${esc(d.name)}</h3><div class="meta">${esc(d.cat)} · ${esc(d.area)}</div>${!compact?`<div class="meta">${esc(d.cost)} ${d.duration?'· '+esc(d.duration):''}</div>`:''}${accommodation?'<span class="status">Accommodation</span>':''}</div>${d.cat==='Accommodation'?`<button class="select-dot ${accommodation?'selected':''}" title="Set as Accommodation" data-action="accommodation" data-id="${d.id}">⌂</button>`:`<button class="select-dot ${selected?'selected':''}" title="Toggle Destination" data-action="select" data-id="${d.id}" ${state.editing?'':'disabled'}>${selected?'✓':'+'}</button>`}</article>`}
    function catalog(limit=5){const s=scenarioState();return `<div class="search"><input aria-label="Search Destinations" placeholder="Search Destinations"><button class="icon-btn">⌕</button></div><div class="chips"><button class="chip on">All</button><button class="chip">Nature</button><button class="chip">Food</button><button class="chip">Shopping</button></div>${s.noResults?`<div class="empty"><b>No matching Destinations</b><span class="muted">Try a wider search or remove a filter.</span><br><br><button class="btn" data-action="clear">Clear search and filters</button></div>`:`<div class="section-title"><h2>Destinations</h2><span class="count">5 curated · A–Z</span></div><div class="stack">${destinations.slice(0,limit).map(d=>destinationCard(d)).join('')}</div>`}`}
    function mapCanvas(){const s=scenarioState();if(s.mapFailed)return `<div class="map"><div class="map-failed"><div><b>Map unavailable</b><p class="muted">You can still search, inspect, and select Destinations from the list.</p><button class="btn">Retry map</button></div></div>`;const route=(s.ready||s.stale||s.infeasible)?`<svg class="route-svg" viewBox="0 0 100 100" preserveAspectRatio="none"><polyline points="27,28 39,35 45,42 67,72 79,84" fill="none" stroke="#ef6b4f" stroke-width="1.7" stroke-dasharray="3 1" vector-effect="non-scaling-stroke"/><polyline points="27,28 39,35 45,42 67,72 79,84" fill="none" stroke="#fff" stroke-width=".45" vector-effect="non-scaling-stroke"/></svg>`:'';return `<div class="map">${route}<span class="map-label" style="left:39%;top:53%">Batam</span><span class="map-label" style="left:73%;top:90%">Galang</span>${destinations.map((d,i)=>`<button class="marker ${state.selected.has(d.id)?'selected':''} ${state.accommodation===d.id?'accommodation':''}" style="left:${d.x}%;top:${d.y}%" data-action="focus" data-id="${d.id}" aria-label="Focus ${esc(d.name)}"><span>${state.selected.has(d.id)?i+1:d.cat==='Accommodation'?'⌂':'·'}</span></button>`).join('')}<div class="map-controls"><button class="map-btn">＋</button><button class="map-btn">−</button><button class="map-btn">◎</button></div><button class="btn search-area">Search this area</button></div>`}
    function detail(){const d=destinations.find(x=>x.id===state.focused)||destinations[0];return `<section class="detail"><div class="detail-hero"></div><span class="eyebrow">${esc(d.cat)} · ${esc(d.area)}</span><h2>${esc(d.name)}</h2><p class="muted">An iconic Batam landmark with wide sea views and a scenic road across the islands.</p><div class="facts"><div class="fact">Entry cost<b>${esc(d.cost||'Not applicable')}</b></div><div class="fact">Typical visit<b>${esc(d.duration||'Anchor only')}</b></div><div class="fact">Hours<b>Open · until 21:00</b></div></div>${state.accommodation?`<div class="compare"><b>From your Accommodation</b>About 29 min · 18 km by ${esc(state.transport)} · non-live estimate</div>`:`<div class="warning-line">Set an Accommodation to see a Travel estimate.</div>`}<div class="stack"><button class="btn primary block" data-action="select" data-id="${d.id}" ${d.cat==='Accommodation'||!state.editing?'disabled':''}>${state.selected.has(d.id)?'Remove from Trip':'Add to Trip'}</button><button class="btn block">Open in Google Maps ↗</button></div></section>`}
    function boundaries(){const s=scenarioState();return `<div class="boundary"><span class="boundary-icon">⚓</span><span><b>Arrival boundary</b><small class="muted" style="display:block">Batam Centre Ferry Terminal</small></span><button class="btn small">${s.missing?'Add':'Fri 09:00'}</button></div><div class="boundary"><span class="boundary-icon">⚓</span><span><b>Departure boundary</b><small class="muted" style="display:block">Harbour Bay Ferry Terminal</small></span><button class="btn small">${s.missing?'Add':'Sun 18:00'}</button></div>`}
    function itinerary(){return `<div class="day-header"><b>Friday · day 1</b><span class="status">3 Visits</span></div><div class="timeline"><div class="visit"><span class="time">09:00</span><b>Arrive · Batam Centre</b></div><div class="travel">26 min by car · estimated</div><div class="visit"><span class="time">09:26–11:26</span><b>Nagoya Hill</b></div><div class="travel">8 min by car · estimated</div><div class="visit"><span class="time">11:34–12:19</span><b>Tua Pek Kong Temple</b></div><div class="travel">43 min by car · estimated</div><div class="visit"><span class="time">13:02–14:02</span><b>Barelang Bridge</b></div></div>`}
    function tripPanel(){const s=scenarioState();let alert='';if(s.offline)alert='<div class="error-line">Connection required. This saved Trip is untouched. <button class="btn small">Retry</button></div>';else if(s.infeasible)alert='<div class="error-line"><b>Rebuild failed.</b> Friday has 45 minutes less usable time than required. Shorten a Visit or widen the Daily window. Your last feasible Itinerary is still shown.</div>';else if(s.stale)alert='<div class="warning-line">3 Trip changes are not reflected below. The last feasible Itinerary is still shown.</div>';else if(s.missing)alert='<div class="warning-line">Before building: add arrival terminal and time, add departure terminal and time.</div>';return `<div class="stack">${alert}<section class="trip-card"><div class="section-title"><h2>Trip boundaries</h2><button class="btn small">Transport · Car</button></div>${boundaries()}<div class="divider"></div><div class="section-title"><h3>Accommodation</h3><button class="btn small">Change</button></div><b>Batam Marriott Hotel Harbour Bay</b><div class="meta">Overnight anchor · optional</div></section><section class="trip-card"><div class="section-title"><h2>${state.selected.size} selected Destinations</h2><button class="btn small">Edit order</button></div>${[...state.selected].map((id,i)=>{const d=destinations.find(x=>x.id===id);return `<div class="selected-row"><span class="order">${i+1}</span><span>${esc(d?.name||id)}</span><button class="icon-btn" data-action="select" data-id="${id}">×</button></div>`}).join('')||'<div class="empty"><b>No Destinations yet</b>Choose from the map or list.</div>'}</section><section class="trip-card">${s.ready||s.stale||s.infeasible?`<div class="section-title"><h2>Itinerary</h2><button class="btn small">Adjust order</button></div>${itinerary()}<button class="btn ${s.stale?'primary':'dark'} block" data-action="build">${s.stale?'Rebuild itinerary':'Open navigation'}</button>`:`<h2 style="margin-top:0">Ready to arrange the Trip?</h2><p class="muted">The planner schedules every selected Destination using your boundaries and non-live Travel estimates.</p><button class="btn primary block" data-action="build">Build itinerary</button>`}</section></div>`}
    function variantA(){return `<main class="workspace"><aside class="column left-column">${catalog()}</aside><section class="map-column">${mapCanvas()}<div class="detail-float">${detail()}</div></section><aside class="column right-column">${tripPanel()}</aside></main>`}
    function variantB(){const s=scenarioState();return `<main class="workspace">${mapCanvas()}<div class="floating-search">${catalog(0).split('<div class="section-title">')[0]}</div><aside class="result-sheet"><div class="section-title"><h2>Explore Batam</h2><span class="count">5 results</span></div>${s.noResults?'<div class="empty"><b>No matches here</b><button class="btn small" data-action="clear">Show all Batam Destinations</button></div>':destinations.map(d=>destinationCard(d,true)).join('')}</aside><aside class="trip-sheet"><div class="section-title"><span><span class="eyebrow">Active Trip</span><h2 style="margin:1px 0">Long weekend</h2></span><button class="btn small" data-action="edit">${state.editing?'Done':'Edit'}</button></div>${state.focused?detail():''}<div class="divider"></div>${tripPanel()}</aside>${s.ready||s.stale?`<div class="route-dock"><b>Friday</b><div class="timeline-mini"><span class="node">⚓ Batam Centre</span><span class="leg">26m →</span><span class="node">Nagoya Hill</span><span class="leg">8m →</span><span class="node">Tua Pek Kong</span><span class="leg">43m →</span><span class="node">Barelang</span></div><button class="btn primary">View day</button></div>`:''}</main>`}
    function variantC(){const s=scenarioState();return `<main class="workspace"><nav class="steps"><div class="step done"><b>1 · Boundaries</b>Ferry times set</div><div class="step active"><b>2 · Destinations</b>${state.selected.size} selected</div><div class="step"><b>3 · Arrange</b>Review constraints</div><div class="step"><b>4 · Use</b>Day-by-day</div></nav><div class="guided-grid"><aside class="guide"><span class="eyebrow">Step 2 of 4</span><h1>Choose your Batam Destinations</h1><p class="muted">Select up to 10. The planner will schedule every selection; it does not recommend or silently remove any.</p>${s.noResults?catalog():`<div class="section-title"><h2>Your Trip</h2><button class="btn small">Edit order</button></div>${[...state.selected].map((id,i)=>{const d=destinations.find(x=>x.id===id);return `<div class="selected-row"><span class="order">${i+1}</span><span>${esc(d?.name||id)}</span><button class="icon-btn" data-action="select" data-id="${id}">×</button></div>`}).join('')}<div class="divider"></div>${boundaries()}<div class="divider"></div>${s.infeasible?'<div class="error-line">Friday needs 45 more minutes. Change a boundary or shorten a Visit.</div>':s.stale?'<div class="warning-line">Changes need a Rebuild; the existing Itinerary is preserved.</div>':''}<button class="btn primary block" data-action="build">${s.stale?'Rebuild itinerary':s.ready?'View itinerary':'Continue to arrange'}</button>`}</aside><section class="canvas">${mapCanvas()}<div class="discovery-rail">${destinations.slice(0,3).map(d=>destinationCard(d)).join('')}</div>${detail()}</section></div></main>`}
    function variantD(){const s=scenarioState();const discover=state.discoverView==='detail'?`<button class="btn back-results" data-action="backresults">← Back to results</button>${detail()}`:catalog();const content=state.paneTab==='discover'?discover:state.paneTab==='itinerary'?`<div class="section-title"><span><span class="eyebrow">Selected day · ordered route</span><h2 style="margin:2px 0">Friday itinerary</h2></span><button class="btn small">Adjust order</button></div>${s.stale?'<div class="warning-line">Trip changes are not reflected below. Rebuild when ready.</div>':''}${s.infeasible?'<div class="error-line">Rebuild failed. The last feasible Itinerary remains below.</div>':''}${itinerary()}<div class="divider"></div><button class="btn dark block">Open navigation</button>`:tripPanel();const work=`<aside class="work-side"><nav class="pane-tabs"><button class="pane-tab ${state.paneTab==='discover'?'on':''}" data-action="panetab" data-tab="discover">Discover</button><button class="pane-tab ${state.paneTab==='trip'?'on':''}" data-action="panetab" data-tab="trip">Trip · ${state.selected.size}</button><button class="pane-tab ${state.paneTab==='itinerary'?'on':''}" data-action="panetab" data-tab="itinerary">Itinerary</button></nav><div class="pane-content">${content}</div></aside>`;if(s.mapFailed)return `<main class="workspace map-down"><div class="map-down-notice"><span>Map unavailable · Trip information and controls remain available.</span><button class="btn small">Retry map</button></div>${work}</main>`;return `<main class="workspace" style="--map-share:${state.desktopSplit}%;--map-mobile-share:${state.mobileSplit}%"><section class="map-side">${mapCanvas()}<div class="map-caption"><b>${destinations.find(d=>d.id===state.focused)?.name||'Batam'}</b><span>Map position and focus are preserved.</span></div></section><div class="splitter" data-splitter role="separator" aria-label="Resize map and workspace" tabindex="0"></div>${work}</main>`}
    function mobileTabs(){return `<nav class="mobile-tabs"><button data-action="tab" data-tab="map">⌖<br>Map</button><button data-action="tab" data-tab="list">☷<br>Discover</button><button data-action="tab" data-tab="trip">▤<br>Trip · ${state.selected.size}</button></nav>`}
    function switcher(){return `<div class="switcher" aria-label="Prototype variant switcher"><button data-action="prev" aria-label="Previous variant">←</button><div class="switcher-label">${state.variant} · ${names[state.variant]}<small>Use ← → to compare</small></div><button data-action="next" aria-label="Next variant">→</button></div>`}
    function render(){document.body.classList.toggle('force-phone',state.viewport==='phone');const kind=`variant-${state.variant.toLowerCase()} ${state.mobileTab==='list'?'mobile-list':state.mobileTab==='trip'?'mobile-trip':'mobile-map'}`;document.getElementById('app').innerHTML=`<div class="shell ${kind}">${tools()}${header()}${state.variant==='A'?variantA():state.variant==='B'?variantB():state.variant==='C'?variantC():variantD()}${state.variant==='D'?'':mobileTabs()}${switcher()}</div>`;}
    function cycle(dir){const vs=['A','B','C','D'],i=vs.indexOf(state.variant);state.variant=vs[(i+dir+vs.length)%vs.length];const u=new URL(location);u.searchParams.set('variant',state.variant);history.replaceState({},'',u);render()}
    document.addEventListener('click',e=>{const el=e.target.closest('[data-action]');if(!el)return;const a=el.dataset.action,id=el.dataset.id;if(a==='prev')cycle(-1);if(a==='next')cycle(1);if(a==='focus'){state.focused=id;if(state.variant==='D'){state.paneTab='discover';state.discoverView='detail'}render()}if(a==='select'){e.stopPropagation();if(!state.editing)return;state.selected.has(id)?state.selected.delete(id):state.selected.add(id);if(state.scenario==='ready')state.scenario='stale';render()}if(a==='accommodation'){e.stopPropagation();state.accommodation=id;render()}if(a==='edit'){state.editing=!state.editing;state.paneTab='trip';render()}if(a==='build'){state.scenario=state.scenario==='missing'?'missing':'ready';state.editing=false;state.paneTab='itinerary';render()}if(a==='clear'){state.scenario='planning';render()}if(a==='tab'){state.mobileTab=el.dataset.tab;render()}if(a==='panetab'){state.paneTab=el.dataset.tab;if(state.paneTab==='discover')state.discoverView='list';render()}if(a==='backresults'){state.discoverView='list';render()}});
    document.addEventListener('change',e=>{if(e.target.dataset.action==='scenario'){state.scenario=e.target.value;if(['ready','stale','infeasible'].includes(state.scenario))state.paneTab='itinerary';else if(state.scenario==='no-results')state.paneTab='discover';else if(['planning','missing'].includes(state.scenario))state.paneTab='trip';render()}if(e.target.dataset.action==='viewport'){state.viewport=e.target.value;render()}});
    let dragging=false;
    document.addEventListener('pointerdown',e=>{const handle=e.target.closest('[data-splitter]');if(!handle)return;dragging=true;handle.setPointerCapture?.(e.pointerId)});
    document.addEventListener('pointermove',e=>{if(!dragging)return;const workspace=document.querySelector('.variant-d .workspace');if(!workspace)return;const r=workspace.getBoundingClientRect(),phone=state.viewport==='phone'||innerWidth<=900,pct=phone?(e.clientY-r.top)/r.height*100:(e.clientX-r.left)/r.width*100,value=Math.max(35,Math.min(65,pct));if(phone){state.mobileSplit=value;workspace.style.setProperty('--map-mobile-share',value+'%')}else{state.desktopSplit=value;workspace.style.setProperty('--map-share',value+'%')}});
    document.addEventListener('pointerup',()=>{if(!dragging)return;dragging=false;const snap=v=>[35,45,60,65].reduce((a,b)=>Math.abs(b-v)<Math.abs(a-v)?b:a);if(state.viewport==='phone'||innerWidth<=900)state.mobileSplit=snap(state.mobileSplit);else state.desktopSplit=snap(state.desktopSplit);render()});
    document.addEventListener('keydown',e=>{if(['INPUT','TEXTAREA','SELECT'].includes(document.activeElement.tagName)||document.activeElement.isContentEditable)return;if(document.activeElement?.matches('[data-splitter]')&&['ArrowLeft','ArrowRight','ArrowUp','ArrowDown'].includes(e.key)){e.preventDefault();const phone=state.viewport==='phone'||innerWidth<=900,delta=['ArrowRight','ArrowDown'].includes(e.key)?5:-5;if(phone)state.mobileSplit=Math.max(35,Math.min(65,state.mobileSplit+delta));else state.desktopSplit=Math.max(35,Math.min(65,state.desktopSplit+delta));render();return}if(e.key==='ArrowLeft')cycle(-1);if(e.key==='ArrowRight')cycle(1)});
    render();
  </script>
</body>
</html>
